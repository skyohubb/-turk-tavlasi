# Düşeş Tavla — Netlify yayın ayarı
# Repo Netlify'a bağlanınca otomatik çalışır. Plugin Next.js API route'larını
# (lig listesi, skor sync) serverless function olarak yayınlar.
# Maç içi sohbet v1.0'da tamamen cihaz-içidir (sunucu fonksiyonu tüketmez).
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Service worker ve manifest her zaman taze gelsin
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# TWA assetlinks
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# Tek sayfa fallback'i YOK — Next routing'i bozardı, bilerek eklenmedi.
# /privacy ve /api/* kendi route'larında çalışır.
